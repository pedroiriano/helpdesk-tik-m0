worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 10m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
  server {
    listen 8080;
    resolver 127.0.0.11 valid=1s;
    set $lab_upstream helpdesk-m0-contract-84fa3ba51b-ui-app;
    absolute_redirect off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://$lab_upstream:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_send_timeout 10s;
    }
    location = /livez {
      proxy_pass http://$lab_upstream:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
      proxy_pass http://$lab_upstream:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin { return 308 /admin/; }
    location ~ /\. { return 404; }

    # Blokir rute template non-Helpdesk TIK Kota Depok (M0-13)
    location ^~ /details/ { return 404; }
    location ~* ^/(?:play|pipeline|plan|pricing|principle|brief|gallery|about|contact)(?:\.html)?$ { return 404; }
    location ~* ^/admin/(?:portal\.html|about|status|app/(?:components|transactions))(?:/.*)?$ { return 404; }

    # Alias semantik modul Web Admin Helpdesk TIK Kota Depok (M0-13)
    location ~* ^/admin/app/audit(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=audit last; }
    location ~* ^/admin/app/(?:reports|analytics)(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=reports last; }
    location ~* ^/admin/app/notifications(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=notifications last; }
    location ~* ^/admin/app/(?:settings|maintenance)(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=maintenance last; }
    location ~* ^/admin/app/(?:users|memberships)(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=memberships last; }
    location ~* ^/admin/app/(?:gallery|media)(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=media last; }
    location ~* ^/admin/app/services(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=services last; }
    location ~* ^/admin/app/portal(?:/.*)?$ { rewrite ^ /admin/app/helpdesk/index.html?kind=navigation last; }

    # Rute semantik Helpdesk TIK Kota Depok (M0-13)
    location = /layanan { rewrite ^ /layanan.html last; }
    location /layanan/ { rewrite ^/layanan/.*$ /detail-layanan.html last; }
    location = /tiket/baru { rewrite ^ /lapor.html last; }
    location ^~ /tiket/baru/ { rewrite ^/tiket/baru/.*$ /lapor.html last; }
    location ^~ /lapor/ { rewrite ^/lapor/.*$ /lapor.html last; }
    location = /tiket/lacak { rewrite ^ /lacak.html last; }
    location = /tiket { rewrite ^ /tiket.html last; }
    location /tiket/ { rewrite ^/tiket/.*$ /detail-tiket.html last; }
    location = /panduan { rewrite ^ /panduan.html last; }
    location /panduan/ { rewrite ^/panduan/.*$ /panduan.html last; }
    location = /faq { rewrite ^ /faq.html last; }
    location = /status { rewrite ^ /status.html last; }
    location = /kontak { rewrite ^ /kontak.html last; }
    location = /masuk { rewrite ^ /akses.html last; }
    location = /login { rewrite ^ /akses.html last; }
    location = /daftar { rewrite ^ /daftar.html last; }
    location = /register { rewrite ^ /daftar.html last; }
    location = /dasbor { rewrite ^ /tiket.html last; }

    location / {
      index index.html;
      try_files $uri $uri/ $uri.html =404;
    }
  }
}
